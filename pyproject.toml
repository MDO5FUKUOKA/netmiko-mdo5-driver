[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmiko-mdo5-driver"
version = "0.1.0"
description = "netmiko 用サードパーティドライバ (BUFFALO VR シリーズ / サン電子 SE220)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ttrip" }]
keywords = ["netmiko", "ssh", "network", "buffalo", "sundenshi", "rooster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = ["netmiko>=4.5,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "mypy>=1.8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["netmiko_mdo5_driver"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
